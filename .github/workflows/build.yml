name: Express.js CI - Build and Test

on:
  push:
    branches: [ "ino_dev" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalacja zaleznosci
        run: npm install

      - name: Weryfikacja wersji
        run: node -e "console.log('Express version:', require('./package.json').version)"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalacja zaleznosci
        run: npm install

      - name: Uruchomienie testow jednostkowych
        run: npm test

  package:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalacja zaleznosci produkcyjnych
        run: npm install --omit=dev

      - name: Pakowanie artefaktu npm
        run: npm pack

      - name: Publikacja gotowego artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: express-package
          path: express-*.tgz